[project]
name = "proofops-workspace"
version = "0.0.0"
description = "ESG ProofOps workspace root (TASK-000 baseline)"
requires-python = ">=3.12"
dependencies = [
  "proofops",
  "proofops-api",
  "proofops-worker",
  "proofops-agent",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<0.29",
  "pytest>=9.1.1,<10",
  "ruff>=0.8,<0.9",
  "mypy>=1.10,<2",
  "jsonschema>=4.18,<5",
  "pyyaml>=6.0,<7",
  "pip-audit==2.10.1",
  "h2==4.4.1",
  "types-pyyaml>=6.0.12.20260906",
]

[tool.uv.workspace]
members = ["packages/proofops", "apps/api", "apps/worker", "apps/agent"]

[tool.uv.sources]
proofops = { workspace = true }
proofops-api = { workspace = true }
proofops-worker = { workspace = true }
proofops-agent = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "legacy_pin: explicitly pinned historical or experimental policy reproduction",
  "slow: measured expensive cold integration, external-process, or replay workload",
]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Archived readers and receipt wrappers are byte-hashed into persisted policies.
# Style-only rewrites would invalidate existing evidence; lint logic still applies.
[tool.ruff.lint.per-file-ignores]
"packages/proofops/adapters/local/_frozen_verifiers/native_paragraph_glyph_v2_cpu_swift/native_glyph_geometry.py" = ["I001"]
"packages/proofops/adapters/local/_frozen_verifiers/native_paragraph_glyph_v2_cpu_swift/source_verification.py" = ["I001"]

[tool.ruff.format]
exclude = [
  "packages/proofops/adapters/local/_frozen_verifiers/**",
  "packages/proofops/adapters/local/_frozen_upstage_ocr_profile_v21_20261015.py",
  "packages/proofops/adapters/local/upstage_ocr_profile_d2_v21.py",
  "packages/proofops/adapters/local/claim_span_bullet_alignment.py",
  "packages/proofops/adapters/local/claim_span_render_resolution.py",
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
# Global-only strict flags; all other strict flags are scoped below.
warn_redundant_casts = true
strict_bytes = true
# numeric.py's byte-pinned writable Protocols reject the existing frozen records.
# TB §5.2/§6 permit a skipped import boundary; preserve its bytes until a separate
# external stub/interface migration can model those records without replay changes.
exclude = ['^packages/proofops/domain/numeric\.py$']
mypy_path = ["packages", "apps/api/src", "apps/worker/src", "apps/agent/src"]

# TB_report §6: explicit protected Python modules (128 of 131 paths; 3 are Swift).
# Persisted source hashes, frozen loaders, and legacy compatibility forbid even
# annotation edits. Each entry records the source/line or preservation reason.
# Keep imports visible so callers retain the annotations these modules expose.
