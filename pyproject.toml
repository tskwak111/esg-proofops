[project]
name = "proofops-workspace"
version = "0.0.0"
description = "ESG ProofOps workspace root (TASK-000 baseline)"
requires-python = ">=3.12"
dependencies = [
  "proofops",
  "proofops-api",
  "proofops-worker",
  "proofops-agent",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<0.29",
  "pytest>=9.1.1,<10",
  "ruff>=0.8,<0.9",
  "mypy>=1.10,<2",
  "jsonschema>=4.18,<5",
  "pyyaml>=6.0,<7",
  "pip-audit==2.10.1",
]

[tool.uv.workspace]
members = ["packages/proofops", "apps/api", "apps/worker", "apps/agent"]

[tool.uv.sources]
proofops = { workspace = true }
proofops-api = { workspace = true }
proofops-worker = { workspace = true }
proofops-agent = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = ["packages/proofops", "apps/api/src", "apps/worker/src", "apps/agent/src"]
