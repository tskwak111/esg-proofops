# WP-B2: mypy 1.20 --strict equivalent. `strict = true` in an override
# enables flags globally, so list its per-module flags explicitly instead.
# Next stages: add "proofops_agent.*", "proofops.application.*",
# "proofops_worker.*", "proofops.adapters.*", "proofops_api.*" to module
# only after their own gates pass. They remain on the baseline for now.
[[tool.mypy.overrides]]
module = ["proofops.domain.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

# Reconciliation/DART is owned by another team (common.md / TB_report §7).
# Do not introduce its strict migration or edit its source in WP-B0/B2.
[[tool.mypy.overrides]]
module = ["proofops.domain.reconciliation.*"]
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
warn_unused_ignores = false
warn_return_any = false
implicit_reexport = true
strict_equality = false
extra_checks = false

[[tool.mypy.overrides]]
module = ["proofops.domain.numeric"]
follow_imports = "skip"

# Path alignment exposes two diagnostics in the explicitly excluded DART work.
# Keep every other check and hand these exact cases to its owning team.
[[tool.mypy.overrides]]
module = ["proofops.adapters.local.reconciliation_store"]
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = ["proofops_api.routers.reconciliation"]
disable_error_code = ["arg-type"]
